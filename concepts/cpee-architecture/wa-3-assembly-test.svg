<text x="425" y="79" class="label" text-anchor="start">Pi-WA3</text>
<text x="425" y="99" class="tiny" text-anchor="start">target host role</text>
<rect id="C3-runtime" x="700" y="105" width="310" height="140" rx="18" class="cpee"/>
<use href="#icon-server" x="722" y="125" width="44" height="44" class="icon icon-blue"/>
<text x="782" y="137" class="label" text-anchor="start">C3 · CPEE</text>
<text x="782" y="164" class="small" text-anchor="start">DSLX → WEEL</text>
<text x="855" y="195" class="tiny" text-anchor="middle">Assemble → Test → Rework → Approve</text>
