<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">WA-3 CPEE and observation architecture</title>
<desc id="diagram-description">Target WA-3 architecture. Physical sensors and equipment connect to Pi drivers, normalized health-aware state, evidence fusion, and a work-area API. The local CPEE instance executes generated WEEL and waits through asynchronous callbacks. Machine safety remains local and independent of CPEE.</desc>
<defs>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #193650; }
    .site { fill: #FAFCFD; stroke: #AAB8C3; stroke-width: 2; }
    .card { fill: #FFFFFF; stroke: #B8C5CF; stroke-width: 2; }
    .target { fill: #F7FAFC; stroke: #90A4B3; stroke-width: 2; stroke-dasharray: 7 6; }
    .cpee { fill: #DCEAF6; stroke: #2B66A9; stroke-width: 2.5; }
    .gateway { fill: #FFF1D8; stroke: #D97706; stroke-width: 2.5; }
    .api { fill: #DDF3EF; stroke: #118A83; stroke-width: 2.5; }
    .layer { fill: #EEF7F5; stroke: #68A9A2; stroke-width: 2; }
    .device { fill: #FFFFFF; stroke: #AAB8C3; stroke-width: 1.8; }
    .store { fill: #F4EFF8; stroke: #75558D; stroke-width: 2; }
    .safety { fill: #FFF1F1; stroke: #C53434; stroke-width: 2; }
    .inventory { fill: #F3F6F8; stroke: #AAB8C3; stroke-width: 1.5; }
    .label { font-size: 17px; font-weight: 650; }
    .small { font-size: 14px; font-weight: 560; }
    .tiny { font-size: 12px; font-weight: 520; fill: #5A6775; }
    .site-label { font-size: 15px; font-weight: 760; letter-spacing: 1.7px; fill: #5A6775; }
    .badge { font-size: 14px; font-weight: 760; fill: #FFFFFF; }
    .muted { fill: #5A6775; }
    .coord { fill: none; stroke: #2B66A9; stroke-width: 2.8; }
    .observe { fill: none; stroke: #118A83; stroke-width: 2.8; }
    .event { fill: none; stroke: #75558D; stroke-width: 2.2; stroke-dasharray: 5 6; }
    .safety-line { fill: none; stroke: #C53434; stroke-width: 3; }
    .thin { fill: none; stroke: #AAB8C3; stroke-width: 1.6; }
    .live { fill: #398F5C; stroke: #FFFFFF; stroke-width: 1.5; }
    .unknown { fill: #D97706; stroke: #FFFFFF; stroke-width: 1.5; }
    .icon { color: #193650; }
    .icon-teal { color: #118A83; }
    .icon-blue { color: #2B66A9; }
    .icon-red { color: #C53434; }
  </style>
  <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#2B66A9"/>
  </marker>
  <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#118A83"/>
  </marker>
  <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#C53434"/>
  </marker>
  <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#75558D"/>
  </marker>
  <symbol id="icon-server" viewBox="0 0 48 48">
    <rect x="6" y="7" width="36" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
    <rect x="6" y="27" width="36" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="3"/>
    <circle cx="13" cy="14" r="2" fill="currentColor"/><circle cx="13" cy="34" r="2" fill="currentColor"/>
    <path d="M 20 14 H 35 M 20 34 H 35" stroke="currentColor" stroke-width="3"/>
  </symbol>
  <symbol id="icon-pi" viewBox="0 0 48 48">
    <rect x="9" y="8" width="30" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
    <rect x="17" y="15" width="14" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M 4 14 H 9 M 4 22 H 9 M 4 30 H 9 M 39 14 H 44 M 39 22 H 44 M 39 30 H 44 M 16 40 V 45 M 24 40 V 45 M 32 40 V 45" stroke="currentColor" stroke-width="2.5"/>
  </symbol>
  <symbol id="icon-machine" viewBox="0 0 48 48">
    <rect x="7" y="8" width="34" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M 14 17 H 34 M 16 35 L 21 25 H 31 L 35 35 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
  </symbol>
  <symbol id="icon-sensor" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="6" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M 14 14 A 14 14 0 0 0 14 34 M 34 14 A 14 14 0 0 1 34 34 M 8 8 A 23 23 0 0 0 8 40 M 40 8 A 23 23 0 0 1 40 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>
  <symbol id="icon-human" viewBox="0 0 48 48">
    <circle cx="24" cy="13" r="7" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M 11 41 C 12 29 17 24 24 24 C 31 24 36 29 37 41" fill="none" stroke="currentColor" stroke-width="3"/>
  </symbol>
  <symbol id="icon-object" viewBox="0 0 48 48">
    <path d="M 7 15 L 24 7 L 41 15 L 24 24 Z M 7 15 V 34 L 24 42 L 41 34 V 15 M 24 24 V 42" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-shield" viewBox="0 0 48 48">
    <path d="M 24 5 L 40 11 V 23 C 40 33 33 40 24 44 C 15 40 8 33 8 23 V 11 Z" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M 16 24 L 22 30 L 33 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-network" viewBox="0 0 48 48">
    <circle cx="24" cy="10" r="5" fill="none" stroke="currentColor" stroke-width="3"/>
    <circle cx="10" cy="37" r="5" fill="none" stroke="currentColor" stroke-width="3"/>
    <circle cx="38" cy="37" r="5" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M 22 15 L 12 32 M 26 15 L 36 32 M 15 37 H 33" fill="none" stroke="currentColor" stroke-width="3"/>
  </symbol>
</defs>
