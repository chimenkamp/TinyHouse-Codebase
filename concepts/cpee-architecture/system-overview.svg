<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Distributed CPEE and WEEL system</title>
<desc id="diagram-description">Target topology with a Munich CPEE coordinator controlling five independent fragment instances: one Munich lid fragment and four Raspberry-Pi-hosted TinyHouse work-area fragments. REST calls and asynchronous callbacks cross the secure boundary; raw observations and MQTT stay local. The four logical Pi roles are not assigned to the seven documented EMQX inventory devices.</desc>
<defs>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #193650; }
    .site { fill: #FAFCFD; stroke: #AAB8C3; stroke-width: 2; }
    .card { fill: #FFFFFF; stroke: #B8C5CF; stroke-width: 2; }
    .target { fill: #F7FAFC; stroke: #90A4B3; stroke-width: 2; stroke-dasharray: 7 6; }
    .cpee { fill: #DCEAF6; stroke: #2B66A9; stroke-width: 2.5; }
    .gateway { fill: #FFF1D8; stroke: #D97706; stroke-width: 2.5; }
    .api { fill: #DDF3EF; stroke: #118A83; stroke-width: 2.5; }
    .layer { fill: #EEF7F5; stroke: #68A9A2; stroke-width: 2; }
    .device { fill: #FFFFFF; stroke: #AAB8C3; stroke-width: 1.8; }
    .store { fill: #F4EFF8; stroke: #75558D; stroke-width: 2; }
    .safety { fill: #FFF1F1; stroke: #C53434; stroke-width: 2; }
    .inventory { fill: #F3F6F8; stroke: #AAB8C3; stroke-width: 1.5; }
    .label { font-size: 17px; font-weight: 650; }
    .small { font-size: 14px; font-weight: 560; }
    .tiny { font-size: 12px; font-weight: 520; fill: #5A6775; }
    .site-label { font-size: 15px; font-weight: 760; letter-spacing: 1.7px; fill: #5A6775; }
    .badge { font-size: 14px; font-weight: 760; fill: #FFFFFF; }
    .muted { fill: #5A6775; }
    .coord { fill: none; stroke: #2B66A9; stroke-width: 2.8; }
    .observe { fill: none; stroke: #118A83; stroke-width: 2.8; }
    .event { fill: none; stroke: #75558D; stroke-width: 2.2; stroke-dasharray: 5 6; }
    .safety-line { fill: none; stroke: #C53434; stroke-width: 3; }
    .thin { fill: none; stroke: #AAB8C3; stroke-width: 1.6; }
    .live { fill: #398F5C; stroke: #FFFFFF; stroke-width: 1.5; }
    .unknown { fill: #D97706; stroke: #FFFFFF; stroke-width: 1.5; }
    .icon { color: #193650; }
    .icon-teal { color: #118A83; }
    .icon-blue { color: #2B66A9; }
    .icon-red { color: #C53434; }
  </style>
