<text x="835" y="958" fill="#17202A" font-family="Arial, sans-serif" font-size="14">Survey table load/height, opening coordinates, outlets, cable paths,</text>
<text x="835" y="982" fill="#17202A" font-family="Arial, sans-serif" font-size="14">P2S ventilation, and rear furniture removal.</text>
<text x="835" y="1013" fill="#B83232" font-family="Arial, sans-serif" font-size="14" font-weight="700">PAROL6 guarding, mounting, E-stop, and safe reset require</text>
<text x="835" y="1037" fill="#B83232" font-family="Arial, sans-serif" font-size="14" font-weight="700">an independent risk assessment. Printed fixtures are not safety devices.</text>
<text x="92" y="1085" fill="#53606C" font-family="Arial, sans-serif" font-size="12">Concept only - not a construction drawing, machine integration approval, fire-protection plan, or certified escape-route plan.</text>
