<text x="118" y="958" fill="#17202A" font-family="Arial, sans-serif" font-size="14">Drawing-derived interior 700 x 220 cm; entrance 150 x 200 cm; opposite window 160 x 100 cm; rear bay 207 cm.</text>
<text x="118" y="982" fill="#17202A" font-family="Arial, sans-serif" font-size="14">Nominal aisle: 95 cm. ASR A2.3 concept target: at least 90 cm for up to five people; confirm applicability on site.</text>
