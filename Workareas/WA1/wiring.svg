<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">WA1 — Print and base quality: table, hardware, wiring and events</title>
  <desc id="desc">Schematic top view of the 127 by 70 centimetre T4 table. All WA1 hardware and printed fixtures, including the optional seven-bay rack adapter, are shown. Dashed amber connections require interface verification. The implemented local API, evidence rules, durable outbox and optional MQTT publisher are distinguished from missing hardware adapters.</desc>
  <defs>
    <pattern id="thermal-grid" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#edbd83"/><rect width="8" height="8" fill="#cb7958"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#147d83" stroke-width="1.7"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a} .title{font-size:34px;font-weight:700;letter-spacing:1px} .section{font-size:23px;font-weight:700;letter-spacing:1.5px} .device{font-size:22px;font-weight:700} .body{font-size:20px} .small{font-size:18px} .tiny{font-size:17px} .muted{fill:#60707a} .code{font-family:monospace;font-size:18px} .label{font-size:18px;font-weight:700;fill:#147d83}
      .panel{fill:#fff;stroke:#d8e0df;stroke-width:2} .equipment{fill:#f5f8fa;stroke:#415763;stroke-width:2.5} .print{fill:#e1f0e5;stroke:#4f8e72;stroke-width:3} .printed-line{fill:none;stroke:#4f8e72;stroke-width:3} .port{fill:#fff;stroke:#415763;stroke-width:2}
      .power{fill:none;stroke:#c65b4d;stroke-width:5;stroke-linejoin:round;stroke-linecap:round} .usb{fill:none;stroke:#3676ba;stroke-width:5;stroke-linejoin:round;stroke-linecap:round} .ethernet{fill:none;stroke:#147d83;stroke-width:5;stroke-linejoin:round;stroke-linecap:round} .sensor{fill:none;stroke:#8857a2;stroke-width:5;stroke-linejoin:round;stroke-linecap:round} .pending{fill:none;stroke:#be8a2d;stroke-width:4;stroke-dasharray:12 8;stroke-linejoin:round} .flow{fill:none;stroke:#147d83;stroke-width:3;marker-end:url(#arrow)} .tag{fill:#fff;stroke:#dce2e2;stroke-width:1}
    </style>
  </defs>
