  <path d="M1985 617V645" class="flow"/>
  <rect x="1660" y="654" width="650" height="75" rx="10" fill="#e6f2ee" stroke="#a4c7b9"/>
  <text x="1680" y="684" class="device">shared/mqtt_delivery.py · optional Paho</text><text x="1680" y="712" class="small">TLS + authentication · mark delivered only after PUBACK</text>

