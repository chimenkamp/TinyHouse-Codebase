  <text x="1980" y="1117" class="tiny muted">start / complete / failed</text>
  <text x="1980" y="1151" class="tiny muted">Others: complete decision</text>
  <path d="M1660 1280H2310" stroke="#e0e6e4" stroke-width="2"/>
  <text x="1660" y="1316" class="label">DIAGNOSTICS</text><text x="1660" y="1346" class="code">tinyhouse/bayreuth/diagnostic/WA1</text>
  <text x="1660" y="1379" class="small muted">Print evidence conflict / Evidence unknown</text>
  <text x="1660" y="1425" class="body">QoS 1 · retain=false · deduplicate event_id</text>
  <text x="1660" y="1461" class="small muted">UUID · run/order/job · outcome · evidence references</text>
  <text x="60" y="1551" class="small muted">Connection concept · verify actual hardware and fit · printed parts are non-safety fixtures</text>
