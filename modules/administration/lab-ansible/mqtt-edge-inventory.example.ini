# TinyHouse MQTT edge setup inventory.
#
# Copy this file before use, for example:
#   cp mqtt-edge-inventory.example.ini mqtt-edge-inventory.ini
#
# Do not commit real passwords. Prefer Ansible Vault:
#   ansible-vault encrypt mqtt-edge-inventory.ini
#
# The central Management-PC broker is documented here as the MQTT target.
# By default this playbook does NOT manage the Management-PC itself, because the
# current Management-PC broker runs as a Windows Mosquitto service.

[mqtt_central]
management_pc ansible_connection=local mqtt_manage_central_broker=false

[all:vars]
mqtt_central_host=192.168.1.100
mqtt_central_port=1883
mqtt_topic_root=tinyhouse/lab
mqtt_command_root=tinyhouse/cmd

[mqtt_central:vars]
mqtt_central_listener_bind=192.168.1.100
mqtt_central_local_listener=127.0.0.1
mqtt_dashboard_username=dashboard_readonly
mqtt_dashboard_password=CHANGE_ME_dashboard_readonly_password

[mqtt_scale_gateway]
scale_gw ansible_host=132.180.196.167 ansible_port=4021 ansible_user=admin hostname=scale-gw mqtt_edge_node=scale-gw mqtt_private_ip=192.168.1.121 mqtt_local_username=scale_writer mqtt_local_password=CHANGE_ME_scale_writer_password mqtt_bridge_remote_username=edge_scale_gw mqtt_bridge_remote_password=CHANGE_ME_edge_scale_gw_password

[mqtt_sensor_pis]
sensor_pi_01 ansible_host=132.180.196.167 ansible_port=4024 ansible_user=admin hostname=sensor-pi-01 mqtt_edge_node=sensor-pi-01 mqtt_private_ip=192.168.1.124 mqtt_local_username=sensor_pi_01_writer mqtt_local_password=CHANGE_ME_sensor_pi_01_writer_password mqtt_bridge_remote_username=edge_sensor_pi_01 mqtt_bridge_remote_password=CHANGE_ME_edge_sensor_pi_01_password
sensor_pi_02 ansible_host=132.180.196.167 ansible_port=4025 ansible_user=admin hostname=sensor-pi-02 mqtt_edge_node=sensor-pi-02 mqtt_private_ip=192.168.1.125 mqtt_local_username=sensor_pi_02_writer mqtt_local_password=CHANGE_ME_sensor_pi_02_writer_password mqtt_bridge_remote_username=edge_sensor_pi_02 mqtt_bridge_remote_password=CHANGE_ME_edge_sensor_pi_02_password

[mqtt_edge:children]
mqtt_scale_gateway
mqtt_sensor_pis

[mqtt_edge:vars]
ansible_become=true
ansible_become_method=sudo
ansible_ssh_private_key_file=~/.ssh/id_ed25519
mqtt_local_port=1883
mqtt_health_interval_seconds=30
mqtt_bridge_qos=1
mqtt_bridge_cleansession=false
mqtt_bridge_try_private=false
