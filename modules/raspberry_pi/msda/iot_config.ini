[SERIAL]
port = /dev/ttyAMA0
baudrate = 115200
timeout = 1

[DATABASE]
path = iot_sensors.db
retention_days = 30
backup_enabled = true
backup_interval_hours = 24

[MONITORING]
sensor_read_interval = 2000
heartbeat_timeout = 30
auto_reconnect = true
max_reconnect_attempts = 10

[ALERTS]
enabled = true
temp_min = -10
temp_max = 50
humidity_min = 20
distance_min = 5
distance_max = 200
motion_threshold = 1

[LOGGING]
level = INFO
file = iot_system.log
max_size_mb = 100
backup_count = 5

